{% load static %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
  <title>{% block title %}WasteWise{% endblock %}</title>
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'rubbish_list' %}">WasteWise</a>
      <div class="navbar-nav">
        <a class="nav-link" href="{% url 'rubbish_list' %}">Waste Types</a>
        <a class="nav-link" href="{% url 'pickups:display_pickup_requests' %}">Display Pickup Request</a>
        <a class="nav-link" href="{% url 'pickups:place_pickup_request_views' %}">Create Pickup Request</a>
      </div>
    </div>
  </nav>

  <main class="container">
    {% for message in messages %}
      <div class="alert alert-success alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>

  <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>

</html>
