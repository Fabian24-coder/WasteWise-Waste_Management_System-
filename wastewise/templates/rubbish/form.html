{% extends "base/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block breadcrumb %}Waste rates{% endblock %}
{% block content %}
<section class="intro">
  <div><label>ADMINISTRATION</label><h1>{{ title }}</h1><p>Set the rate per unit and the additional charge per kilometre.</p></div>
</section>
<section class="panel form-panel">
  <form method="post" class="form-grid">
    {% csrf_token %}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}
        {{ field }}
        {% if field.help_text %}<small class="help-text">{{ field.help_text }}</small>{% endif %}
        {% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
      </label>
    {% endfor %}
    <div class="actions">
      <button class="btn primary" type="submit">Save waste type</button>
      <a class="btn secondary" href="{% url 'rubbish_list' %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
