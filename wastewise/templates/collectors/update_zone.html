{% extends 'rubbish/base.html' %}

{% block title %}Edit Zone{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title mb-3">Edit Zone</h4>
        <form method="post">
          {% csrf_token %}
          {{ update_zone.as_p }}
          <button type="submit" class="btn btn-success">Save changes</button>
          <a href="{% url 'collectors:display_zones' %}" class="btn btn-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
